<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
</head>
<body>
<button onclick='goFullscreen()'>FullScreen</button>
<input type="text" id="mobileInput" style="position:absolute; top:100px; left:100px; opacity:100;">
<script>
function goFullscreen() {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    } else if (document.documentElement.mozRequestFullScreen) { // Firefox
        document.documentElement.mozRequestFullScreen();
    } else if (document.documentElement.webkitRequestFullscreen) { // Chrome, Safari, Opera
        document.documentElement.webkitRequestFullscreen();
    } else if (document.documentElement.msRequestFullscreen) { // IE/Edge
        document.documentElement.msRequestFullscreen();
    }
}
    function showMobileInput(x, y, width, height, currentText) {
        let input = document.getElementById("mobileInput");
        input.style.position = "absolute";
        input.style.left = x + "px";
        input.style.top = y + "px";
        input.style.width = width + "px";
        input.style.height = height + "px";
        input.style.opacity = 1;
        input.value = currentText;
        input.focus();

        input.onblur = function() {
            unityInstance.SendMessage('InputFieldHandler', 'OnInputEnd', input.value);
            input.style.opacity = 0;
            input.style.position = "absolute";
            input.style.top = "-100px";
        };
    }
</script>
</body>
</html>
